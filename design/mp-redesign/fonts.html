<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><title>号码字体对照</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Fredoka:wght@600&family=Bricolage+Grotesque:opsz,wght@96,800&family=Fraunces:opsz,wght,SOFT@144,900,100&family=Big+Shoulders+Display:wght@900&family=Unbounded:wght@800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe3;--card:#fffdf8;--ink:#1f2a22;--soft:#5e675f;--bam:#34794c;--tom:#ff6a3d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",sans-serif;padding:36px 40px 44px;width:1500px}
h1{font-size:26px;margin:0 0 6px}p.lead{margin:0 0 28px;color:var(--soft);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:26px 22px}
.cell h2{font-size:17px;margin:14px 4px 2px}.cell p{margin:0 4px;color:var(--soft);font-size:13.5px;line-height:1.55}
.ticket{background:var(--bam);color:#fff;border-radius:30px;box-shadow:0 20px 40px rgba(52,121,76,.28);overflow:hidden}
.ticket.hot{background:var(--tom);box-shadow:0 20px 44px rgba(255,106,61,.34)}
.stub{padding:24px 22px 0;height:150px}
.r1{display:flex;align-items:center;font-size:14px;font-weight:700}.pill{font-size:11px;background:rgba(255,255,255,.22);padding:3px 10px;border-radius:15px}.r1 b{margin-left:auto}
.now{display:flex;align-items:flex-end;gap:10px;margin-top:6px}.num{font-size:96px;line-height:.9}.side{font-size:13px;padding-bottom:10px;line-height:1.45}
.perf{margin:0 22px;border-top:2px dashed rgba(255,255,255,.4)}
.body{padding:16px 22px 18px;display:flex;gap:8px;align-items:center}
.chip{min-width:40px;height:32px;padding:0 12px;border-radius:16px;background:rgba(255,255,255,.2);display:inline-flex;align-items:center;justify-content:center;font-size:15px}
.chip.next{background:#fff;color:var(--bam)}.hot .chip.next{color:var(--tom)}
.digits{margin:10px 4px 0;font-size:34px;color:var(--bam);letter-spacing:.02em;line-height:1}
.f0{font-family:"SF Pro Rounded","Avenir Next","DIN Alternate","Segoe UI",sans-serif;font-weight:800;letter-spacing:-.03em}
.f1{font-family:"Baloo 2";font-weight:800}
.f2{font-family:"Fredoka";font-weight:600}
.f3{font-family:"Bricolage Grotesque";font-weight:800;letter-spacing:-.03em}
.f4{font-family:"Fraunces";font-weight:900;font-variation-settings:"SOFT" 100;letter-spacing:-.02em}
.f5{font-family:"Big Shoulders Display";font-weight:900}
.f6{font-family:"Unbounded";font-weight:800;letter-spacing:-.04em}
.f5 .num,.num.f5{font-size:112px}
</style></head><body>
<h1>大号码换什么字体</h1>
<p class="lead">同一张号码票，只换数字的字体。每款下面那排是 0–9 的样子；右边一张是到号时（番茄橘）的效果。</p>
<div class="grid" id="g"></div>
<script>
const F=[
 ['f0','现在：系统字','手机自带，不用加载。干净，但没有性格。'],
 ['f1','A  Baloo 2','圆、胖、有弹性，和熊猫最像一家人。最亲切。'],
 ['f2','B  Fredoka','也是圆体，比 A 瘦一点、安静一点，像儿童绘本。'],
 ['f3','C  Bricolage Grotesque','笔画有粗细变化、切角带一点手工感，像设计工作室的海报。'],
 ['f4','D  Fraunces（软衬线）','带衬线的“老票据”味，最像真的纸质叫号单。个性最强。'],
 ['f5','E  Big Shoulders','又高又窄的招牌字，像车站看板和排队机，三位数也放得下。'],
 ['f6','F  Unbounded','宽扁、圆角方块，潮牌感。三位数会比较挤。'],
];
const t=(f,n,hot)=>`<div class="ticket ${hot?'hot':''}"><div class="stub"><div class="r1"><span class="pill">● 直播中</span><b>Hypeyourself</b></div>
<div class="now"><span class="num ${f}">${n}</span><span class="side">号 ${hot?'到了！':'讲解中'}<br>宽松工装裤</span></div></div><div class="perf"></div>
<div class="body">${[31,36,128].map((c,i)=>`<span class="chip ${f} ${i==0?'next':''}">${c}</span>`).join('')}</div></div>`;
g.innerHTML=F.map(([f,name,why],i)=>`<div class="cell">${t(f,i%2?27:27,false)}<div class="digits ${f}">0123456789</div><h2>${name}</h2><p>${why}</p></div>`).join('')
 +`<div class="cell">${t('f1',31,true)}<div class="digits f1" style="color:var(--tom)">到号 · A</div><h2>到号时（以 A 为例）</h2><p>号码变橘色时的样子。</p></div>`;
</script></body></html>
