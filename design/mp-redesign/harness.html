<!doctype html><html><head><meta charset="utf-8">
<!-- 開發用：在瀏覽器裡粗略模擬小程序頁面（WXML/WXSS＋頁面 JS＋假資料），只用來抓版面問題，不是真的小程序執行環境 -->
<style>body{margin:0;background:#d8d4ca;display:flex;gap:24px;padding:24px;flex-wrap:wrap}
.phone{width:390px;height:844px;overflow:hidden;position:relative;border-radius:40px;box-shadow:0 20px 60px rgba(0,0,0,.2);transform:translateZ(0)}
.navbar{height:88px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px;box-sizing:border-box;font:600 16px -apple-system,sans-serif;background:#f3efe3;color:#000}
.scroll{position:absolute;top:88px;left:0;right:0;bottom:0;overflow:auto}
.cap{font:600 13px sans-serif;margin:6px}
</style></head><body>
<script>
const ROOT='/miniprogram/';
const W=390,K=W/750;
const rpx=s=>s.replace(/(-?\d*\.?\d+)rpx/g,(_,n)=>(+n*K).toFixed(2)+'px');
async function txt(p){const r=await fetch(ROOT+p);if(!r.ok)throw new Error(p);return r.text()}
function scopeCss(css,scope){
 css=rpx(css).replace(/\/\*[\s\S]*?\*\//g,'').replace(/\bpage\s*\{/g,scope+'{');
 return css.replace(/(^|\})\s*([^{}@]+)\{/g,(m,b,sel)=>{if(/^\s*(from|to|\d+%)/.test(sel))return m;
  return b+sel.split(',').map(s=>{s=s.trim();return s.startsWith(scope)?s:scope+' '+s}).join(',')+'{'});
}
function evalExpr(expr,ctx){try{return Function('ctx','with(ctx){return ('+expr+')}')(ctx)}catch(e){return ''}}
function interp(s,ctx){if(s==null)return s;const m=s.match(/^\{\{([\s\S]*)\}\}$/);if(m)return evalExpr(m[1],ctx);
 return s.replace(/\{\{([\s\S]*?)\}\}/g,(_,e)=>{const v=evalExpr(e,ctx);return v==null?'':v})}
const TAG={view:'div',text:'span',image:'img',input:'input',block:null,picker:'div',switch:'div'};
function build(node,ctx,out){
 const kids=[...node.childNodes];let chainDone=false;
 for(const n of kids){
  if(n.nodeType===3){const t=interp(n.textContent,ctx);if(String(t).trim())out.append(document.createTextNode(t));continue}
  if(n.nodeType!==1)continue;
  if(n.hasAttribute('wx:if')){chainDone=!!interp(n.getAttribute('wx:if'),ctx);if(!chainDone)continue}
  else if(n.hasAttribute('wx:elif')){if(chainDone)continue;chainDone=!!interp(n.getAttribute('wx:elif'),ctx);if(!chainDone)continue}
  else if(n.hasAttribute('wx:else')){if(chainDone)continue}
  if(n.hasAttribute('wx:for')){const list=interp(n.getAttribute('wx:for'),ctx)||[];const it=n.getAttribute('wx:for-item')||'item';const ix=n.getAttribute('wx:for-index')||'index';
   (Array.isArray(list)?list:[]).forEach((v,i)=>emit(n,Object.assign(Object.create(ctx),{[it]:v,[ix]:i}),out));continue}
  emit(n,ctx,out);
 }
}
function emit(n,ctx,out){
 const tag=TAG[n.tagName];if(tag===undefined&&!(n.tagName in TAG))return;
 if(tag===null){build(n,ctx,out);return}
 const el=document.createElement(tag);
 for(const a of n.attributes){if(a.name.startsWith('wx:')||a.name.startsWith('bind')||a.name.startsWith('catch')||a.name.startsWith('hover'))continue;
  let v=interp(a.value,ctx);if(a.name==='style')v=rpx(String(v));if(a.name==='src'&&String(v).startsWith('/'))v=ROOT.slice(0,-1)+v;
  if(a.name==='placeholder-class'||a.name==='mode')continue;el.setAttribute(a.name,v)}
 if(tag==='img'&&n.getAttribute('mode')==='widthFix')el.style.height='auto';
 if(tag==='div'||tag==='span'){if(tag==='div')el.style.display=el.style.display||'';}
 build(n,ctx,el);out.append(el);
}
function makeEnv(){const env={wx:{getWindowInfo:()=>({windowWidth:W}),getSystemInfoSync:()=>({windowWidth:W}),showToast(){},showModal(){},showLoading(){},hideLoading(){},navigateTo(){},stopPullDownRefresh(){},createSelectorQuery(){return{in(){return this},select(){return this},boundingClientRect(){return this},exec(){}}},getStorageSync(){},setStorageSync(){},setNavigationBarTitle(){},showActionSheet(){},navigateBack(){},setClipboardData(){},getClipboardData(){return Promise.resolve({data:''})}}};return env}
function setPath(obj,path,v){const ks=path.replace(/\[(\d+)\]/g,'.$1').split('.');let o=obj;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=v}
async function runPage(name,api,query){
 const js=await txt(`pages/${name}/${name}.js`);let def;const env=makeEnv();
 const require=p=>p.includes('brand')?{NAME:'直播蹲蹲'}:api;const Page=d=>{def=d};
 Function('require','Page','wx','setTimeout','setInterval',js)(require,Page,env.wx,(f,ms)=>0,()=>0);
 const inst=Object.assign({},def);inst.data=JSON.parse(JSON.stringify(def.data));
 inst.setData=p=>{for(const k in p)setPath(inst.data,k,p[k])};
 if(inst.onLoad)await inst.onLoad(query||{});
 if(inst.refresh)await inst.refresh();
 if(inst.load)await inst.load();
 return inst;
}
async function render(name,api,query,caption,after,label){
 const inst=await runPage(name,api,query);if(after)await after(inst);
 const [wxml,pageCss,appCss]=await Promise.all([txt(`pages/${name}/${name}.wxml`),txt(`pages/${name}/${name}.wxss`),txt('app.wxss')]);
 const box=document.createElement('div');const id='p'+Math.random().toString(36).slice(2);
 box.innerHTML=`<div class="phone"><div class="navbar">${caption}</div><div class="scroll ${id}"></div></div><div class="cap">${label||name}</div>`;
 document.body.append(box);const scroll=box.querySelector('.scroll');
 const st=document.createElement('style');st.textContent=scopeCss(appCss,'.'+id)+scopeCss(pageCss,'.'+id)+`.${id}{display:block;min-height:100%;box-sizing:border-box} .${id} div{display:block} .${id} span{display:inline} .${id} [class*="btn"],.${id} input{box-sizing:border-box} .${id} input{border:0;outline:0;font:inherit;width:100%}`;
 document.head.append(st);
 const doc=new DOMParser().parseFromString('<root xmlns:wx="wx">'+wxml.replace(/&/g,'&amp;').replace(/\{\{[\s\S]*?\}\}/g,m=>m.replace(/</g,'&lt;').replace(/>/g,'&gt;')).replace(/(\s)wx:else(?=[\s\/>])/g,'$1wx:else=""')+'</root>','text/xml');
 if(doc.querySelector('parsererror'))throw new Error(name+' wxml parse: '+doc.querySelector('parsererror').textContent.slice(0,200));
 build(doc.documentElement,inst.data,scroll);
 // fixed 元素：相對手機框
 const phone=box.querySelector('.phone');
 const ov=document.createElement('div');ov.className=id;ov.setAttribute('style','position:absolute;left:0;right:0;top:0;bottom:0;background:transparent;pointer-events:none;min-height:0;padding:0');phone.append(ov);
 scroll.querySelectorAll('.bottom').forEach(b=>{b.style.position='absolute';ov.append(b)});
 return inst;
}
window.harness={render};
</script>
<script src="harness-shot.js"></script>
<script src="harness-data.js"></script>
</body></html>
